substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: kengi-tech-api
  _CLOUD_SQL_INSTANCE: kengi-tech:asia-southeast1:kengi-tech-db
  _DB_NAME: kengi_tech
  _DB_USER: postgres
  _DB_PASSWORD: KengiTech2026%40
  _REDIS_URL: ""
  # Token tĩnh cho Kengi Stream studio — CHỈ dành cho script/cron, KHÔNG đưa vào
  # FE bundle (browser đăng nhập bằng tài khoản hệ thống, xem routes/livestream.ts).
  # Token cũ ks_9a0b... đã bị bake vào bundle công khai nên phải xoay.
  _LIVESTREAM_TOKEN: ks_e5fa256dd45dbdf7288514121fd976cafa57b856d7e4a982
  # Proxy chuyển tiếp câm để egress Shopee đi qua IP tĩnh Tino (đã whitelist),
  # né source_ip_undeclared của Cloud Run (IP động). Xem shopee-forward.php.
  _SHOPEE_FORWARD_SECRET: eb15f8a9ec6e6d4b241f8f525fec29c5552c9a826e113952
  # Đăng nhập Super Admin Panel (kengi.vn/admin) — so SERVER-SIDE ở POST /admin/login,
  # KHÔNG bake vào bundle FE. Xem routes/admin.ts.
  _ADMIN_PANEL_USER: superadmin
  _ADMIN_PANEL_PASS: Kengi@2026
  # Facebook App cho kengi.vn/fanpage-manager (routes/fanpage.ts + webhooks/facebook).
  # Lấy ở developers.facebook.com → App → Settings → Basic.
  #  - _FB_APP_ID / _FB_APP_SECRET: thiếu thì POST /api/fanpage/connect trả 500,
  #    KHÔNG đổi được short-lived token → long-lived (cả app tê liệt).
  #  - _FB_WEBHOOK_VERIFY_TOKEN: chuỗi tự đặt, phải khớp ô "Verify token" khi
  #    cấu hình Webhooks trong FB App (callback https://api.kengi.vn/api/webhooks/facebook).
  _FB_APP_ID: ""
  _FB_APP_SECRET: ""
  _FB_WEBHOOK_VERIFY_TOKEN: 368333bd84ccb3dbde261bd50366490f56e63b13cfaaac20

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

  # Step 3: Deploy to Cloud Run with Cloud SQL connector
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--port'
      - '8080'
      - '--session-affinity'
      - '--add-cloudsql-instances'
      - '${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars'
      - >-
        NODE_ENV=production,DATABASE_URL=postgresql://${_DB_USER}:${_DB_PASSWORD}@localhost/${_DB_NAME}?host=/cloudsql/${_CLOUD_SQL_INSTANCE},CORS_ORIGIN=*,APP_BASE_URL=https://kengi.vn,REDIS_URL=${_REDIS_URL},LIVESTREAM_STUDIO_TOKEN=${_LIVESTREAM_TOKEN},SHOPEE_FORWARD_PROXY=https://kengi.vn/ai-livestream/shopee-forward.php,SHOPEE_FORWARD_SECRET=${_SHOPEE_FORWARD_SECRET},ADMIN_PANEL_USER=${_ADMIN_PANEL_USER},ADMIN_PANEL_PASS=${_ADMIN_PANEL_PASS},PRISMA_POOL_TIMEOUT=30,FB_APP_ID=${_FB_APP_ID},FB_APP_SECRET=${_FB_APP_SECRET},FB_WEBHOOK_VERIFY_TOKEN=${_FB_WEBHOOK_VERIFY_TOKEN}

  # Step 4: Force 100% traffic onto the just-deployed revision.
  # When the service's traffic has ever been pinned to a *named* revision (rather
  # than latestRevision:true), `gcloud run deploy` creates the new revision but
  # does NOT migrate traffic to it — so fixes silently never go live (the cause of
  # the TikTok sync staying broken: traffic was stuck on an old revision while
  # every fix deployed as a no-traffic revision). `--to-latest` re-points traffic
  # to the newest revision AND restores latestRevision:true so future deploys
  # auto-migrate again. Idempotent.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - '${_SERVICE_NAME}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--to-latest'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
